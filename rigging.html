<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rigging | Minakshi</title>
<link rel="stylesheet" href="subpage.css">
</head><body>
<div id="rot"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Please rotate your phone to landscape</div>
<div class="bg"></div>
<a class="back" href="index.html#portfolio" aria-label="Back to portfolio"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back</a>

<main class="card">
  <h1>Rigging</h1>
  <div class="reel">
    <figure style="--i:1"><img src="guatar4.png" alt="3D acoustic guitar, full body view"><figcaption>Guitar: full view</figcaption></figure>
    <figure style="--i:2"><img src="guitar1.png" alt="3D guitar neck and headstock"><figcaption>Guitar: neck and headstock</figcaption></figure>
    <figure style="--i:3"><img src="guitar2.png" alt="Close-up of guitar tuning pegs"><figcaption>Guitar: tuning pegs</figcaption></figure>
    <figure style="--i:4"><img src="guitar3.png" alt="Close-up of guitar bridge and strings"><figcaption>Guitar: bridge and strings</figcaption></figure>
  </div>
</main>

<div class="lb" id="lb" aria-hidden="true"><img alt=""></div>
<script>
const lb=document.getElementById('lb'),lbi=lb.querySelector('img');
document.querySelectorAll('.reel img').forEach(i=>i.onclick=()=>{lbi.src=i.src;lbi.alt=i.alt;lb.classList.add('open')});
lb.onclick=()=>lb.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
</script>
</body></html>
